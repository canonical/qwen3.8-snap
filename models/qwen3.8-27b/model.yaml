name: qwen3.8-27b
alias: 27b

description: |
  Qwen 3.8 27b, Q4_K_M GGUF quantization, with multimodal (vision) projection
  weights.
model-card-url: https://huggingface.co/unsloth/Qwen3.8-27B-GGUF
quantization: Q4_K_M

disk-size: 19800M

capabilities:
  - text
  - vision
  - thinking
  - tools

components:
  - model-q4-k-m-gguf-1-of-4
  - model-q4-k-m-gguf-2-of-4
  - model-q4-k-m-gguf-3-of-4
  - model-q4-k-m-gguf-4-of-4
  - mmproj-27b-q4-k-m

environment:
  - MODEL_NAME=qwen3.8-27b-ud-q4-k-m
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-27b-q4-k-m/mmproj-BF16.gguf
  - SHARDS_DIR=/tmp/qwen3-8-27b-ud-q4-k-m-shards
  - MODEL_FILE=$SHARDS_DIR/Qwen3.8-27B-UD-Q4_K_M-gguf-00001-of-00004.gguf

layout:
  $SHARDS_DIR/Qwen3.8-27B-UD-Q4_K_M-gguf-00001-of-00004.gguf:
    symlink: $SNAP_COMPONENTS/model-q4-k-m-gguf-1-of-4/Qwen3.8-27B-UD-Q4_K_M-gguf-00001-of-00004.gguf
  $SHARDS_DIR/Qwen3.8-27B-UD-Q4_K_M-gguf-00002-of-00004.gguf:
    symlink: $SNAP_COMPONENTS/model-q4-k-m-gguf-2-of-4/Qwen3.8-27B-UD-Q4_K_M-gguf-00002-of-00004.gguf
  $SHARDS_DIR/Qwen3.8-27B-UD-Q4_K_M-gguf-00003-of-00004.gguf:
    symlink: $SNAP_COMPONENTS/model-q4-k-m-gguf-3-of-4/Qwen3.8-27B-UD-Q4_K_M-gguf-00003-of-00004.gguf
  $SHARDS_DIR/Qwen3.8-27B-UD-Q4_K_M-gguf-00004-of-00004.gguf:
    symlink: $SNAP_COMPONENTS/model-q4-k-m-gguf-4-of-4/Qwen3.8-27B-UD-Q4_K_M-gguf-00004-of-00004.gguf
